AWSTemplateFormatVersion: '2010-09-09'
Description: CodeBuild project for Lambda Pipeline

Parameters:
  AppName:
    Type: String
    Description: App name
    Default: ledger

  Environment:
    Type: String
    Description: Environment name

  BuildPurpose:
    Type: String
    Description: logical purpose of produced artifact

Resources:
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AppName}-${Environment}-${BuildPurpose}-build-project"
      ServiceRole: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppName}-${Environment}-lambda-build-role"
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub "/${AppName}-${Environment}/codebuild"
          StreamName: !Sub "${BuildPurpose}"
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
      Artifacts:
        Type: CODEPIPELINE 
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub "infrastructure/cicd/lambda/${BuildPurpose}/buildspec.yml"
      TimeoutInMinutes: 5

Outputs:
  CodeBuildProjectName:
    Description: "CodeBuild Project Name"
    Value: !Ref CodeBuildProject
    Export:
      Name: !Sub ${AppName}-${Environment}-${BuildPurpose}-build-project-name