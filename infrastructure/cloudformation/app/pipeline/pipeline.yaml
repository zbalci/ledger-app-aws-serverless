AWSTemplateFormatVersion: '2010-09-09'
Description: CodeBuild project for Lambda Pipeline

Parameters:
  AppName:
    Type: String
    Description: App name

  Environment:
    Type: String
    Description: Environment name

  GithubConnectionArn:
    Type: String
    Description: Github Connection ARN
    NoEcho: True

  SourceRepo:
    Type: String
    Description: owner/repo biçiminde GitHub repo ID'si

  SourceBranchPath:
    Type: String
    Description: logical purpose of produced artifact

  SourceBranch:
    Type: String

  BuildPurpose:
    Type: String
    Description: logical purpose of produced artifact

Resources:
  CodePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${AppName}-${Environment}-${BuildPurpose}-pipeline"
      RoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppName}-${Environment}-lambda-pipeline-role"
      ArtifactStore:
        Type: S3
        Location: !Sub "${AppName}-${Environment}-${AWS::AccountId}-serverless-artifacts"
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              Namespace: SourceVariables
              ActionTypeId: 
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GithubConnectionArn
                FullRepositoryId: !Ref SourceRepo
                BranchName: !Ref SourceBranch
                DetectChanges: true
              OutputArtifacts:
                - Name: SourceArtifact

        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Sub "${AppName}-${Environment}-${BuildPurpose}-build-project"
                EnvironmentVariables: !Sub |
                  [
                    {
                      "name": "APP_NAME",
                      "value": "${AppName}",
                      "type": "PLAINTEXT"
                    },
                    {
                      "name": "ENVIRONMENT",
                      "value": "${Environment}",
                      "type": "PLAINTEXT"
                    },
                    {
                      "name": "ARTIFACT_BUCKET",
                      "value": "${AppName}-${Environment}-${AWS::AccountId}-serverless-artifacts",
                      "type": "PLAINTEXT"
                    }
                  ]
              InputArtifacts:
                - Name: SourceArtifact

      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: Source
            Push:
              - Branches:
                  Includes:
                    - !Sub ${SourceBranch}
                FilePaths:
                  Includes:
                    - !Sub "src/${SourceBranchPath}/**"