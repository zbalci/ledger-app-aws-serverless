AWSTemplateFormatVersion: '2010-09-09'
Description: CodeBuild project for Lambda Pipeline

Parameters:
  AppName:
    Type: String
    Description: App name

  Environment:
    Type: String
    Description: Environment name

  GithubConnectionArn:
    Type: String
    Description: Github Connection ARN
    NoEcho: True

Resources:
  ### IAM Role for CodePipeline
  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-${Environment}-lambda-pipeline-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole

  CodePipelinePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${AppName}-${Environment}-lambda-pipeline-policy
      Roles:
        - !Ref CodePipelineRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3BucketAccess
            Effect: Allow
            Action:
              - s3:GetBucketVersioning
              - s3:GetBucketAcl
              - s3:GetBucketLocation
            Resource:
              Fn::Sub:
                - "arn:aws:s3:::${ArtifactBucket}"
                - ArtifactBucket: !Sub "${AppName}-${Environment}-${AWS::AccountId}-serverless-artifacts"

          - Sid: AllowS3ObjectAccess
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:PutObjectAcl
              - s3:GetObject
              - s3:GetObjectVersion
            Resource:
              Fn::Sub:
                - "arn:aws:s3:::${ArtifactBucket}/*"
                - ArtifactBucket: !Sub "${AppName}-${Environment}-${AWS::AccountId}-serverless-artifacts"

          - Effect: Allow
            Action:
              - codebuild:BatchGetBuilds
              - codebuild:StartBuild
            Resource: !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${AppName}-${Environment}-*-build-project"

          - Effect: Allow
            Action:
              - codestar-connections:UseConnection
              - codestar-connections:GetConnectionToken
              - codeconnections:UseConnection
              - codeconnections:GetConnectionToken
            Resource:
              - !Ref GithubConnectionArn