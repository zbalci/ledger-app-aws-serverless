AWSTemplateFormatVersion: '2010-09-09'
Description: CodeBuild project for Lambda Pipeline

Parameters:
  AppName:
    Type: String
    Description: App name

  Environment:
    Type: String
    Description: Environment name

  GithubConnectionArn:
    Type: String
    Description: Github Connection ARN
    NoEcho: True

Resources:
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-${Environment}-lambda-build-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeBuildDeveloperAccess
      Policies:
        - PolicyName: AdditionalPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

              # FUNCTION
              - Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:PublishVersion
                  - lambda:ListVersionsByFunction
                  - lambda:DeleteFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppName}-${Environment}*"


              # LAYER
              - Effect: Allow
                Action:
                  - lambda:PublishLayerVersion
                  - lambda:GetLayerVersion
                  - lambda:ListLayerVersions
                  - lambda:DeleteLayerVersion
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:${AppName}-${Environment}*"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:${AppName}-${Environment}*:*"

              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  Fn::Sub:
                    - "arn:aws:s3:::${ArtifactBucket}/*"
                    - ArtifactBucket: !Sub "${AppName}-${Environment}-${AWS::AccountId}-serverless-artifacts"

              - Sid: GitHubConnectionAccess
                Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                  - codestar-connections:GetConnectionToken
                  - codeconnections:UseConnection
                  - codeconnections:GetConnectionToken
                Resource: !Ref GithubConnectionArn

              - Sid: CodeBuildSSMAccess
                Effect: Allow
                Action:
                  - ssm:GetParameter*
                  - ssm:PutParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AppName}/${Environment}/lambda/layer*

              - Effect: Allow
                Action:
                  - codepipeline:StartPipelineExecution
                  - codepipeline:ListPipelineExecutions
                Resource: !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${AppName}-${Environment}-*"

Outputs:
  CodeBuildRoleArn:
    Description: "CodeBuild Role Arn"
    Value: !GetAtt CodeBuildRole.Arn
    Export:
      Name: !Sub ${AppName}-${Environment}-lambda-build-role-arn