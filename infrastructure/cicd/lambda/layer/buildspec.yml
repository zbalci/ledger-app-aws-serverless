version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --upgrade pip

      - echo Installing security tools...

      # Pip-audit and SBOM
      - pip install pip-audit cyclonedx-bom

      # Trivy
      - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
      - mv ./bin/trivy /usr/local/bin/trivy

  pre_build:
    commands:
    -  echo "Running dependency vulnerability scan..."
    -  pip-audit -r src/layers/python/requirements.txt --strict

  build:
    commands:

      # ---------- BUILD LAYER ----------
      - |
        mkdir -p layer_build/python/lib/python3.12/site-packages
        pip install -r src/layers/python/requirements.txt \
          -t layer_build/python/lib/python3.12/site-packages

      - | 
        PYTHONPATH=layer_build/python/lib/python3.12/site-packages pip check

      - |
        cd layer_build/
        ZIP_NAME=layer-$CODEBUILD_RESOLVED_SOURCE_VERSION.zip
        zip -r ../$ZIP_NAME python
        cd ..

  post_build:
    commands:
      # ---------- TRIVY SCAN ----------
      - |
        echo "Running Trivy scan on built layer..."
        trivy fs --scanners vuln,secret,misconfig \
          --severity CRITICAL,HIGH \
          --exit-code 1 layer_build/

    finally:
      # ---------- UPLOAD TO S3 ----------
      - |
        S3_KEY="$ENVIRONMENT/layer/$ZIP_NAME"

        aws s3 cp $ZIP_NAME \
          s3://$ARTIFACT_BUCKET/$S3_KEY

      # ---------- PUBLISH NEW LAYER VERSION ----------
      - |
        LAYER_NAME="$APP_NAME-$ENVIRONMENT-lambda-layer"

        echo "Publishing new layer version: $LAYER_NAME"

        LAYER_ARN=$(aws lambda publish-layer-version \
          --layer-name "$LAYER_NAME" \
          --content S3Bucket=$ARTIFACT_BUCKET,S3Key=$S3_KEY \
          --compatible-runtimes python3.12 \
          --query "LayerVersionArn" \
          --output text)

        echo "New Layer ARN: $LAYER_ARN"

      # ---------- WRITE TO SSM ----------
      - |
        aws ssm put-parameter \
          --name "/$APP_NAME/$ENVIRONMENT/lambda/layer" \
          --value "$LAYER_ARN" \
          --type String \
          --overwrite

      # ---------- SBOM ----------

      - |
        SBOM_PREFIX="sbom/$ENVIRONMENT/layer/$CODEBUILD_RESOLVED_SOURCE_VERSION"
        cyclonedx-py -r src/layers/python/requirements.txt -o sbom.json
        aws s3 cp sbom.json s3://$ARTIFACT_BUCKET/$SBOM_PREFIX/sbom.json

      - |
        cat <<EOF > metadata.json
        {
          "app": "$APP_NAME",
          "environment": "$ENVIRONMENT",
          "layer_name": "$LAYER_NAME",
          "layer_arn": "$LAYER_ARN",
          "commit": "$CODEBUILD_RESOLVED_SOURCE_VERSION",
          "build_id": "$CODEBUILD_BUILD_ID",
          "build_time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        }
        EOF

        aws s3 cp metadata.json s3://$ARTIFACT_BUCKET/$SBOM_PREFIX/metadata.json

      # ---------- TRIGGER FUNCTION PIPELINE ----------
      - |
        FUNCTION_PIPELINE="$APP_NAME-$ENVIRONMENT-function-pipeline"

        STATUS=$(aws codepipeline list-pipeline-executions \
          --pipeline-name "$FUNCTION_PIPELINE" \
          --max-items 1 \
          --query "pipelineExecutionSummaries[0].status" \
          --output text)

        echo "Function pipeline status: $STATUS"

        if [ "$STATUS" = "InProgress" ]; then
          echo "Function pipeline already running. Skip trigger."
          exit 0
        fi

        echo "Starting function pipeline..."

        EXEC_ID=$(aws codepipeline start-pipeline-execution \
          --name "$FUNCTION_PIPELINE" \
          --query "pipelineExecutionId" \
          --output text)

        echo "Started execution id: $EXEC_ID"