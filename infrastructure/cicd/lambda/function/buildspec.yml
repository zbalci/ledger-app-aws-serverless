version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12

  build:
    commands:
      - |
        LAYER_PIPELINE="${APP_NAME}-${ENVIRONMENT}-layer-pipeline"

        echo "Checking layer pipeline status: $LAYER_PIPELINE"

        while true; do
          RUNNING=$(aws codepipeline list-pipeline-executions \
            --pipeline-name "$LAYER_PIPELINE" \
            --query "pipelineExecutionSummaries[?status=='InProgress'] | length(@)" \
            --output text)

          if [ "$RUNNING" = "0" ]; then
            echo "Layer pipeline not running. Continue."
            break
          fi

          echo "Layer pipeline running... waiting 15s"
          sleep 15
        done

      - |
        cd src/web
        ZIP_NAME=function-${CODEBUILD_RESOLVED_SOURCE_VERSION}.zip
        zip -r $ZIP_NAME app config.py lambda_function.py
        aws s3 cp $ZIP_NAME s3://$LAMBDA_BUCKET/$ENVIRONMENT/function/$ZIP_NAME