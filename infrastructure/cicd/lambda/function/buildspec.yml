version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo Installing security tools...

      # Bandit
      - pip install bandit

      # Trivy
      - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
      - mv ./bin/trivy /usr/local/bin/trivy

  pre_build:
    commands:
      # ---------- RUN INTEGRATION TESTS ----------
      - |
      - echo "Running integraton tests..."
        python -m unittest discover -s tests -t src/web/

      # ---------- STATIC ANALYSIS ----------
      - echo "Running Python security scan (Bandit)..."
      - bandit -r src/web/ -lll -ii || echo "Bandit warnings detected"

      # ---------- APP SECURITY SCAN ----------
      - echo "Running Trivy repo vulnerability scan..."
      - trivy fs --scanners vuln,secret,misconfig --severity CRITICAL,HIGH --exit-code 1 src/web/

  build:
    commands:

      # ---------- CHECK LAYER PIPELINE ----------
      - |
        LAYER_PIPELINE="$APP_NAME-$ENVIRONMENT-layer-pipeline"

        echo "Checking layer pipeline status: $LAYER_PIPELINE"

        while true; do
          RUNNING=$(aws codepipeline list-pipeline-executions \
            --pipeline-name "$LAYER_PIPELINE" \
            --query "pipelineExecutionSummaries[?status=='InProgress'] | length(@)" \
            --output text)

          if [ "$RUNNING" = "0" ]; then
            echo "Layer pipeline not running. Continue."
            break
          fi

          echo "Layer pipeline running... waiting 15s"
          sleep 15
        done


      # ---------- GET LAYER ARN FROM SSM ----------
      - |
        PARAM="/$APP_NAME/$ENVIRONMENT/lambda/layer"

        echo "Reading layer ARN from SSM: $PARAM"

        LAYER_ARN=$(aws ssm get-parameter \
          --name "$PARAM" \
          --query Parameter.Value \
          --output text)

        echo "Layer ARN: $LAYER_ARN"


      # ---------- CREATE CODE ZIP ----------
      - |
        cd src/web

        ZIP_NAME=function-$CODEBUILD_RESOLVED_SOURCE_VERSION.zip
        S3_KEY="$ENVIRONMENT/function/$ZIP_NAME"

        zip -r $ZIP_NAME app config.py lambda_function.py \
          -x "*.pyc" "*__pycache__*" "*.pytest_cache*"

      # ---------- UPLOAD TO S3 ----------
      - |
        echo "Uploading artifact to S3..."
        aws s3 cp $ZIP_NAME s3://$ARTIFACT_BUCKET/$S3_KEY


      # ---------- UPDATE FUNCTION CODE ----------
      - |
        FUNCTION_NAME="$APP_NAME-$ENVIRONMENT-lambda-function"

        REVISION=$(aws lambda get-function \
          --function-name "$FUNCTION_NAME" \
          --query 'Configuration.RevisionId' \
          --output text)

        echo "Updating Lambda function code..."
        aws lambda update-function-code \
          --function-name "$FUNCTION_NAME" \
          --s3-bucket "$ARTIFACT_BUCKET" \
          --s3-key "$S3_KEY" \
          --revision-id "$REVISION"

      # ---------- WAIT UNTIL CODE UPDATED ----------
      - |
        echo "Waiting for Lambda update to complete..."
        aws lambda wait function-updated \
          --function-name "$FUNCTION_NAME"

      # ---------- CHECK CURRENT LAYER ----------
      - |
        CURRENT_LAYER=$(aws lambda get-function-configuration \
          --function-name "$FUNCTION_NAME" \
          --query "Layers[0].Arn" \
          --output text 2>/dev/null || echo "none")

        echo "Current layer: $CURRENT_LAYER"
        echo "Target layer:  $LAYER_ARN"

        if [ "$CURRENT_LAYER" != "$LAYER_ARN" ]; then

          echo "Layer changed. Updating configuration..."

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --layers "$LAYER_ARN"

          echo "Waiting for configuration update..."
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

        else
          echo "Layer already up to date. Skipping."
        fi

      # ---------- PUBLISH VERSION ----------
      - |
        echo "Publishing new version..."

        aws lambda publish-version \
          --function-name "$FUNCTION_NAME"