version: 0.2

env:
  variables:
    S3_BUCKET: ledger-app-aws-lambda

phases:
  install:
    runtime-versions:
      python: 3.12

  pre_build:
    commands:
      - set -e
      - cd $CODEBUILD_SRC_DIR

      - echo ">>> Detecting changed files"

      - |
        if git rev-parse HEAD~1 >/dev/null 2>&1; then
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
        else
          echo "No previous commit found, treating all files as changed"
          CHANGED_FILES=$(git diff --name-only HEAD)
        fi

      - echo "$CHANGED_FILES"

      - BUILD_LAYER=false
      - BUILD_FUNCTION=false

      - |
        if echo "$CHANGED_FILES" | grep -q '^src/layers/'; then
          BUILD_LAYER=true
        fi

      - |
        if echo "$CHANGED_FILES" | grep -q '^src/web/'; then
          BUILD_FUNCTION=true
        fi

  build:
    commands:
      - |
        if [ "$BUILD_LAYER" = true ]; then
          echo ">>> Building Lambda Layer"

          mkdir -p build/layer/python
          pip install -r src/layers/python/requirements.txt \
            -t build/layer/python

          cd build/layer
          zip -r ../../layer.zip .
          cd -

          aws s3 cp layer.zip s3://$S3_BUCKET/build/
        else
          echo ">>> Layer unchanged, skip"
        fi

      - |
        if [ "$BUILD_FUNCTION" = true ]; then
          echo ">>> Building Lambda Function"

          cd src/web
          zip -r ../../function.zip app config.py lambda_function.py
          cd -

          aws s3 cp function.zip s3://$S3_BUCKET/build/
        else
          echo ">>> Function unchanged, skip"
        fi

artifacts:
  files:
    - '*.zip'